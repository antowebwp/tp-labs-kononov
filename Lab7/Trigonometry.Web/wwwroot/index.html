<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab7 · Тригонометрия</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main><h1>Тригонометрический калькулятор</h1>
<div class="layout"><section class="panel"><h2>Параметры расчёта</h2><form id="form"><label class="field">Угол<input id="angle" name="angle" value="30" inputmode="decimal" autocomplete="off" required></label><div class="row"><label class="field">Единицы<select id="units"><option value="degrees">Градусы</option><option value="radians">Радианы</option></select></label><label class="field">Знаков после запятой<select id="digits"></select></label></div><label class="field">История<select id="storage"><option value="memory">В памяти — до перезапуска</option><option value="file">В файле — сохраняется</option></select></label><button class="primary" id="calculate">Вычислить</button><p class="note">Диапазон угла: от −1 000 000 до 1 000 000.<br>Дробную часть можно вводить через точку или запятую.</p><p class="status" id="status" role="status" aria-live="polite"></p></form></section>
<section class="panel" aria-label="Результаты"><div class="result-header"><h2>Результат</h2><span class="equation" id="equation">Ожидает расчёта</span></div><div class="cards" id="results"><div class="card"><div class="name">sin</div><div class="value" id="sin">—</div></div><div class="card"><div class="name">cos</div><div class="value" id="cos">—</div></div><div class="card"><div class="name">tg</div><div class="value" id="tan">—</div></div><div class="card"><div class="name">ctg</div><div class="value" id="cot">—</div></div></div></section></div>
<section class="panel history"><div class="result-header"><h2>Последние вычисления</h2><button class="secondary" id="refresh" type="button">Обновить</button></div><div id="history" class="table-wrap"><p class="empty">Загрузка истории…</p></div></section></main></body></html>
